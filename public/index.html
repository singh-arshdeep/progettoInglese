<!doctype html>
<html lang="en" data-type="software" data-radius="soft" data-motion>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iPhone 17 Review Lab</title>
<meta name="description" content="A live class game: quiz on linkers of manner and recommending phrases, then rate our iPhone 17 review from your phone.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  tasteskill deal (start.mjs, --page gaming): palette and type taken from the group's own presentation: renders' black and graphite, bone ink, sage for good, coral for bad, Lexend, radius 16px.
  Three screens: the host's phone is the remote, the projector only shows, the class plays from their phones.
  Motion: hero entrance; hover/press layer; game moments (wipe between screens, 3-2-1 countdown, live word cloud,
  scoreboard rows sliding to their new rank, podium with drumroll).
-->
<style>
/* Layout: one centred column (760px; 1240px on the big screen) over a lit graphite ground; views swap in place */
:root{
  color-scheme:dark;
  --bg:#000000; --surface:#1f2329; --surface2:#2a2f37; --line:#3a414b;
  --ink:#e3e2da; --muted:#a3a8a1; --accent:#8fe3b5; --accent-ink:#000000;
  --ok:#8fe3b5; --bad:#ff9b85;
  --t0:#ff9b85; --t1:#9cc3ff; --t2:#c8b6ff; --t3:#8fe3b5;
  --display:"Lexend",system-ui,sans-serif; --text:"Lexend",system-ui,sans-serif; --mono:"Lexend",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1); --enter:cubic-bezier(.16,1,.3,1); --io:cubic-bezier(.76,0,.24,1);
  --r:16px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--text);font-variant-numeric:tabular-nums;font-synthesis-weight:none;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.035em;line-height:1.02;margin:0;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* lit ground */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(120% 70% at 0% 0%,rgba(143,227,181,.2),rgba(143,227,181,.06) 45%,transparent 75%),radial-gradient(90% 60% at 100% 100%,rgba(227,226,218,.05),transparent 70%)}
.orb{display:none}
body.host .sky{background:none}
body.host .orb{display:block}
.orb{position:absolute;border-radius:50%}
.orb.a{width:70vmax;height:70vmax;left:-28vmax;top:-32vmax;background:radial-gradient(circle closest-side,rgba(143,227,181,.26),rgba(143,227,181,.08) 55%,transparent)}
.orb.b{width:60vmax;height:60vmax;right:-26vmax;bottom:-26vmax;background:radial-gradient(circle closest-side,rgba(227,226,218,.06),transparent)}
.grid{display:none}
body.host .orb.a{animation:driftA 24s linear infinite alternate}
body.host .orb.b{animation:driftB 30s linear infinite alternate}
body.host .grid{display:block;position:absolute;inset:0;background-image:linear-gradient(rgba(227,226,218,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(227,226,218,.035) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 25%,#000 30%,transparent 75%)}
@keyframes driftA{to{transform:translate(12vw,8vh)}}
@keyframes driftB{to{transform:translate(-10vw,-10vh)}}

/* shell */
.wrap{max-width:760px;margin:0 auto;padding-block:max(16px,env(safe-area-inset-top,0px)) 72px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
body.host .wrap{max-width:1240px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:26px;min-height:44px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 0;cursor:pointer;font:500 16px var(--display);letter-spacing:-.02em;min-height:44px}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:500 13px var(--mono);font-style:normal}
.tr{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font:500 13px var(--mono);min-height:44px;display:inline-flex;align-items:center}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(31,35,41,.7);cursor:pointer;display:grid;place-items:center;transition:transform 150ms var(--ease),border-color 150ms}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.view{display:grid;gap:22px}
.enter{animation:viewIn .5s var(--enter) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}}
@keyframes settle{from{opacity:0;transform:scale(.94)}}
@keyframes fadeIn{to{opacity:1}}

/* buttons (hover layer: step 1px up, press 1px down at .985) */
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:600 16px var(--text);padding:14px 22px;border-radius:var(--r);cursor:pointer;min-height:48px;transition:transform 150ms var(--ease),background 150ms var(--ease)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.big{font-size:19px;padding:20px 24px;min-height:64px;width:100%}
.btn:disabled{opacity:.45;cursor:default}
@media (hover:hover) and (pointer:fine){
  .btn:hover:not(:disabled){transform:translateY(-1px);background:color-mix(in srgb,var(--accent) 86%,var(--ink))}
  .btn.ghost:hover:not(:disabled){background:rgba(227,226,218,.06);box-shadow:inset 0 0 0 1px var(--muted)}
  .iconbtn:hover{transform:translateY(-1px);border-color:var(--muted)}
}
.btn:active:not(:disabled),.iconbtn:active{transform:translateY(1px) scale(.985);transition-duration:90ms}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(40px,8vw,68px);line-height:1;letter-spacing:-.045em;margin:14px 0 16px}
h1 .ln{display:block;overflow:hidden;padding-bottom:.08em}
h1 .ln span{display:inline-block;animation:rise .9s var(--enter) both}
h1 .ln:nth-child(2) span{animation-delay:.12s;color:var(--accent)}
@keyframes rise{from{transform:translateY(105%)}}
.lead{color:var(--muted);margin:0;max-width:42ch;animation:viewIn .7s .3s var(--enter) both}
.hero-vid{position:relative;width:100%;max-width:560px;aspect-ratio:4/3;justify-self:center;animation:settle 1.1s .2s var(--enter) both}
.hero-vid video{width:100%;height:100%;object-fit:cover}
.hero-vid::before{content:none}
.hero-vid .chip{position:absolute;font:500 11px var(--mono);padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:bob 3.2s ease-in-out infinite}
.hero-vid .chip b{color:var(--accent);font-weight:500}
.hero-vid .c1{left:0;top:22%}.hero-vid .c2{right:0;top:50%;animation-delay:-1.1s}.hero-vid .c3{left:6%;bottom:14%;animation-delay:-2.2s}
@keyframes bob{50%{transform:translateY(-8px)}}

/* choices (linked cards: lift 2px, border steps darker) */
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.choice{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:22px;cursor:pointer;display:grid;gap:10px;align-content:start;transition:transform 180ms var(--ease),border-color 180ms,box-shadow 180ms;animation:viewIn .6s var(--enter) both}
.choice:nth-child(2){animation-delay:.08s}.choice:nth-child(3){animation-delay:.16s}
.choice.main{border-color:var(--accent)}
@media (hover:hover) and (pointer:fine){.choice:hover{transform:translateY(-2px);border-color:var(--muted);box-shadow:0 12px 24px rgba(0,0,0,.25)}.choice:hover .go svg{transform:translateX(3px)}}
.choice:active{transform:translateY(0) scale(.985)}
.ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--surface2)}
.ico svg{width:24px;height:24px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.choice h2{font-size:23px;line-height:1.15}
.choice p{margin:0;color:var(--muted);font-size:15px}
.go{font:600 15px var(--text);color:var(--accent);display:flex;align-items:center;gap:6px;margin-top:4px}
.go svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;transition:transform 150ms var(--ease)}

/* panels */
.panel{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;display:grid;gap:18px;overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.title{font-size:30px;line-height:1.1}
.muted{color:var(--muted);margin:0}
.tag{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-radius:8px;background:var(--surface2);color:var(--muted)}
.tag.hot{color:var(--accent)}
.qnum{font:500 14px var(--mono);color:var(--muted);display:flex;align-items:center;gap:10px}
.qnum b{color:var(--ink);font-size:22px;font-weight:500}
.stat{font:500 14px var(--mono);color:var(--muted)}
.stat b{font-size:26px;color:var(--ink);font-weight:500}
.form{display:grid;gap:10px;max-width:420px;width:100%;margin:0 auto}
.form label{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.form input{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--ink);font:500 20px var(--text);padding:16px;border-radius:var(--r);text-align:center}
.form input:focus{outline:2px solid var(--accent);outline-offset:1px}
.form input.pinput{letter-spacing:.25em;font-family:var(--mono)}
.err{color:var(--bad);font-weight:600;margin:0;min-height:1.4em;text-align:center}

/* ---------- big screen ---------- */
.wipe{position:fixed;inset:0;z-index:40;pointer-events:none;display:grid;place-items:center;background:var(--accent);clip-path:inset(0 100% 0 0)}
.wipe span{font:400 clamp(48px,9vw,128px)/1 var(--display);letter-spacing:-.05em;color:var(--accent-ink);text-align:center;padding:0 24px}
.wipe.on{animation:wipeIn .5s var(--io) forwards}
.wipe.on span{animation:viewIn .5s .15s var(--enter) both}
.wipe.off{animation:wipeOut .5s var(--io) forwards}
@keyframes wipeIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes wipeOut{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 0 100%)}}
.gate{min-height:60vh;place-content:center;justify-items:center;text-align:center}
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:start}
.joinbox{justify-items:center;text-align:center}
.qr{background:#fff;padding:14px;border-radius:16px;animation:settle .8s var(--enter) both}
.qr img,.qr canvas{display:block;width:min(270px,62vw)!important;height:auto!important}
.url{font-size:15px;color:var(--muted);margin:0;word-break:break-all}
.url b{color:var(--ink);font-weight:500}
.pin{display:flex;gap:5px;max-width:100%}
.pin span{font:500 clamp(26px,3.6vw,46px)/1 var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 6px;min-width:1.1em;text-align:center;animation:digit .6s var(--enter) both}
@keyframes digit{from{opacity:0;transform:translateY(40%)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:140px;align-content:flex-start}
.pchip{padding:10px 16px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-weight:600;animation:chipIn .5s var(--enter) both}
@keyframes chipIn{0%{opacity:0;transform:scale(.3) translateY(20px)}60%{opacity:1}}
.chips.small{min-height:0}.chips.small .pchip{padding:6px 12px;font-size:14px;animation:none}
.waiting{color:var(--muted);display:flex;align-items:center;gap:12px;margin:0}
.dotsx{display:inline-flex;gap:6px;align-items:center;height:10px}.dotsx i{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.35;animation:dot 1.2s ease-in-out infinite}
.dotsx i:nth-child(2){animation-delay:.2s}.dotsx i:nth-child(3){animation-delay:.4s}
@keyframes dot{30%{opacity:1;transform:scale(1.25)}60%{opacity:.35;transform:none}}
.pstate .waiting{justify-content:center}
.bigcount{font:500 clamp(54px,7vw,92px)/1 var(--mono);color:var(--accent)}

/* countdown before a question */
.pre{min-height:68vh;display:grid;place-content:center;justify-items:center;text-align:center;gap:26px}
.pre .hprompt{max-width:22ch}
.w{display:inline-block;animation:wordIn .55s var(--enter) both}
@keyframes wordIn{from{opacity:0;transform:translateY(.5em);filter:blur(6px)}}
.cdring{width:160px;height:160px;border-radius:50%;display:grid;place-items:center;position:relative}
.cdring::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--line)}
.cdring.tick::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--accent);animation:ringOut .9s var(--enter) forwards}
@keyframes ringOut{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
.cdring b{font:500 88px/1 var(--mono);animation:cdPop .9s var(--enter) both}
@keyframes cdPop{0%{transform:scale(2.2);opacity:0}25%{opacity:1}100%{transform:scale(1)}}

/* question */
.qstage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:center}
.clip{border-radius:16px;overflow:hidden;background:#1f2329;aspect-ratio:16/9;border:1px solid var(--line)}
.clip video{width:100%;height:100%;object-fit:contain;display:block}
.hprompt{font:400 clamp(24px,3.4vw,42px)/1.2 var(--display);letter-spacing:-.03em;margin:0;text-wrap:balance}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent);margin:0 3px;transform:translateY(-4px)}
.timer{width:76px;height:76px;position:relative;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:7}
.timer .tt{stroke:var(--surface2)}
.timer .tv{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:201;transition:stroke-dashoffset .25s linear}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font:500 24px var(--mono)}
.timer.low b{color:var(--bad);animation:beat 1s steps(1) infinite}
@keyframes beat{50%{opacity:.4}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{--c:var(--t0);position:relative;display:flex;align-items:center;gap:14px;padding:18px;border-radius:var(--r);background:var(--c);color:#000000;font:500 clamp(17px,2vw,24px)/1.25 var(--display);letter-spacing:-.02em;overflow:hidden;border:0;text-align:left;animation:tileIn .55s var(--enter) both;transition:opacity .5s var(--ease),transform .5s var(--ease)}
@keyframes tileIn{from{opacity:0;transform:translateY(30px) scale(.95)}}
.tile:nth-child(2){animation-delay:.07s}.tile:nth-child(3){animation-delay:.14s}.tile:nth-child(4){animation-delay:.21s}
.t1{--c:var(--t1)}.t2{--c:var(--t2)}.t3{--c:var(--t3)}
.tile .sh{flex:none;width:40px;height:40px;border-radius:10px;background:rgba(0,0,0,.16);display:grid;place-items:center}
.tile .sh svg{width:20px;height:20px;fill:currentColor}
.tile .cnt{margin-left:auto;font:500 22px var(--mono)}
.tile .fillbar{position:absolute;left:0;bottom:0;height:6px;background:rgba(0,0,0,.28);width:100%;transform:scaleX(0);transform-origin:left;transition:transform 1s var(--enter)}
.tile.no{opacity:.22;transform:scale(.96)}
.tile.yes{box-shadow:0 0 0 4px var(--ink);animation:yesPop .7s var(--enter)}
@keyframes yesPop{40%{transform:scale(1.04)}}
.why{font-size:18px;color:var(--muted);margin:0}
.answerbig{font:400 clamp(36px,5vw,58px)/1 var(--display);letter-spacing:-.04em;color:var(--ok);animation:settle .6s var(--enter) both}

/* live word cloud for fill-the-gap */
.cloud{min-height:190px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;align-content:center;gap:10px 18px;padding:18px;border-radius:18px;background:rgba(0,0,0,.6);border:1px dashed var(--line)}
.word{font:500 22px/1.1 var(--display);letter-spacing:-.02em;color:var(--ink);display:inline-flex;align-items:flex-start;gap:4px;transform:rotate(var(--r,0deg));animation:wordPop .6s var(--enter) both;transition:font-size .5s var(--enter),opacity .5s,color .5s}
.word sup{font:500 12px var(--mono);color:var(--muted)}
.word:nth-child(4n+1){color:#ffc4b6}.word:nth-child(4n+2){color:#bcd6ff}.word:nth-child(4n+3){color:#ddd1ff}
@keyframes wordPop{0%{opacity:0;transform:scale(.2) rotate(var(--r,0deg))}60%{opacity:1}}
.word.ok{color:var(--ok)!important;text-shadow:0 0 30px rgba(143,227,181,.6);animation:okPop .8s var(--enter) both}
.word.ok sup{color:var(--ok)}
@keyframes okPop{40%{transform:scale(1.35)}}
.word.dim{opacity:.22;text-decoration:line-through;text-decoration-thickness:2px}
.cloud .empty{color:var(--muted);margin:0}

/* scoreboard with rows sliding to their new rank */
.sb{display:grid;gap:10px}
.sbrow{display:grid;grid-template-columns:2.6em minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:16px 18px;border-radius:var(--r);background:var(--surface2);position:relative;overflow:hidden}
.sbrow.move{transition:transform .9s var(--enter)}
.sbrow .bar2{position:absolute;inset:0;background:rgba(143,227,181,.16);transform:scaleX(0);transform-origin:left;transition:transform 1.1s var(--enter)}
.sbrow>*:not(.bar2){position:relative}
.sbrow .pos{font:500 18px var(--mono);color:var(--accent)}
.sbrow .nm{font:600 21px var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbrow .pts{font:500 22px var(--mono);min-width:4ch;text-align:right}
.gain{font:500 14px var(--mono);color:var(--ok);opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s var(--enter)}
.gain.show{opacity:1;transform:none}
.arrow-up{color:var(--ok);font:500 13px var(--mono)}

/* podium */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;min-height:340px}
.pod{position:relative;display:grid;justify-items:center;gap:8px;text-align:center;min-width:0}
.pod .av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:500 24px var(--display);color:#000000;opacity:0;animation:avDrop .7s var(--enter) forwards}
@keyframes avDrop{from{opacity:0;transform:translateY(-40px) scale(.6)}to{opacity:1;transform:none}}
.pod .nm,.pod .pts{opacity:0;animation:fadeIn .5s forwards}
.pod .nm{font-weight:600;font-size:19px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pts{font:500 14px var(--mono);color:var(--muted)}
.pod .block{width:100%;border-radius:14px 14px 6px 6px;display:grid;place-items:center;font:500 30px var(--mono);color:#000000;transform-origin:bottom;transform:scaleY(0);animation:grow 1s var(--enter) forwards}
@keyframes grow{to{transform:scaleY(1)}}
.p1 .av,.p1 .block{background:#f5b82e}.p2 .av,.p2 .block{background:#c9cbcf}.p3 .av,.p3 .block{background:#d9875a}
.p1 .block{height:170px}.p2 .block{height:120px}.p3 .block{height:90px}
.p3 .block{animation-delay:.4s}.p3 .av,.p3 .nm,.p3 .pts{animation-delay:1.1s}
.p2 .block{animation-delay:1.5s}.p2 .av,.p2 .nm,.p2 .pts{animation-delay:2.2s}
.p1 .block{animation-delay:4.6s}.p1 .av,.p1 .nm,.p1 .pts{animation-delay:5.2s}
.spot{position:absolute;left:50%;bottom:0;width:340px;height:520px;transform:translateX(-50%);background:linear-gradient(to bottom,rgba(255,236,190,.0),rgba(255,236,190,.22));clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);opacity:0;animation:fadeIn .8s 4.6s forwards;pointer-events:none}
ol.board{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ol.board li{display:grid;grid-template-columns:2.4em 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--surface2);opacity:0;animation:viewIn .45s var(--enter) forwards}
ol.board .pos,ol.board .pts{font:500 15px var(--mono)}
ol.board .pos{color:var(--muted)}

/* rating */
.ratestage{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:center}
.screen-box{border-radius:16px;overflow:hidden;background:#000;aspect-ratio:16/9;border:1px solid var(--line)}
.screen-box video{width:100%;height:100%;object-fit:cover;display:block}
.overall{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.big{font:400 84px/1 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums;display:inline-block}

/* ---------- presentation: the group's deck in a fixed 1600×900 window, scaled to fit,

.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:#000;box-shadow:0 0 0 1px var(--line)}

.progress{flex:1;height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}

.copy code{flex:1;min-width:0;overflow-wrap:anywhere;font:500 14px var(--mono);background:var(--surface2);padding:12px;border-radius:10px}

  if (!confetti.bits || !confetti.bits.length) { c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
  const colors = ['#8fe3b5', '#9cc3ff', '#c8b6ff', '#ff9b85', '#e3e2da'];
  const bits = confetti.bits = confetti.bits || [];
  for (let i = 0; i < n; i++) bits.push({x:x + (Math.random() - .5) * 40 * power, y, vx:(Math.random() - .5) * 16 * power, vy:(-Math.random() * 17 - 6) * power, r:Math.random() * 6 + 4, a:Math.random() * 6, va:(Math.random() - .5) * .3, col:colors[Math.random() * colors.length | 0], life:220});
  if (confetti.running) return;
  confetti.running = true;

    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (let i = bits.length - 1; i >= 0; i--) {
      const b = bits[i]; b.vy += .45; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.a += b.va;

function burstAt(el, n = 24){ if (!el) return; const r = el.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2, n, .55); }
const ord = n => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const stars = avg => { const f = Math.round(avg); return '★'.repeat(f) + `<span class="off">${'★'.repeat(5 - f)}</span>`; };
const preLeft = (st, off) => st.startedAt ? st.startedAt - (Date.now() + off) : 0;
const timeLeft = (st, off) => st.q && st.startedAt ? Math.max(0, Math.min(st.q.limit, st.q.limit - (Date.now() + off - st.startedAt))) : 0;

/* presentation: the group's own deck (presentation/), shown in a 1600×900 window and driven step by step */
const DECK_W = 1600;
const fit = new ResizeObserver(es => es.forEach(e => e.target.style.setProperty('--s', e.contentRect.width / DECK_W)));
const deckFrame = (id = 'stage') => `<div class="stage" id="${id}"><iframe src="presentation/index.html?embed=1" title="Presentation" tabindex="-1" aria-hidden="true"></iframe></div>`;
function mountDeck(id){ const el = $(id); if (el && !el.dataset.fit) { el.dataset.fit = 1; fit.observe(el); } }
// move a stage's deck to a step; waits until the deck inside the frame is ready
function deckGo(id, step){
  const el = $(id), f = el && el.querySelector('iframe'); if (!f) return;
  f.dataset.want = step;
  const run = (tries = 0) => {
    const d = f.contentWindow && f.contentWindow.deck;
    if (d) { if (f.dataset.at !== String(f.dataset.want)) { d.goTo(+f.dataset.want); f.dataset.at = f.dataset.want; } }
    else if (tries < 120) setTimeout(() => run(tries + 1), 150);
  };

}
// glossary words and "Show answers" opened on the big screen, copied to every other screen
function deckUi(id, ui){
  const el = $(id), f = el && el.querySelector('iframe'), d = f && f.contentWindow && f.contentWindow.deck;
  const want = JSON.stringify(ui || {terms:[], solved:false});
  if (d && d.setUi && f.dataset.ui !== want) { d.setUi(JSON.parse(want)); f.dataset.ui = want; }

let onDeckUi = null;
addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.type === 'deck-ui' && onDeckUi) onDeckUi(e.data.ui); });
// how many steps the deck has and where each part starts (read once from a hidden copy)
let DECK = null, DECK_INFO = null;
function deckInfo(){
  if (DECK) return DECK;
  DECK = new Promise((resolve, reject) => {
    const f = document.createElement('iframe');
    f.src = 'presentation/index.html?embed=1'; f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
    f.style.cssText = `position:fixed;left:-${DECK_W + 100}px;top:0;width:${DECK_W}px;height:900px;border:0;visibility:hidden`;
    document.body.appendChild(f);
    let tries = 0;
    const check = () => {
      const d = f.contentWindow && f.contentWindow.deck;
      if (d) { DECK_INFO = {total:d.total(), stops:d.stops()}; f.remove(); resolve(DECK_INFO); }
      else if (++tries > 120) { f.remove(); DECK = null; reject(new Error("The presentation didn't load. Check the connection.")); }

    f.addEventListener('load', check);

}
const partAt = step => DECK_INFO ? DECK_INFO.stops.filter(x => x.step <= step).pop() : null;

let loop = null, tick = null;
function stop(){ clearTimeout(loop); clearInterval(tick); loop = tick = null; onDeckUi = null; document.body.classList.remove('host', 'present'); $('topRight').hidden = true; Sound.stopMusic(); }

function remoteView(h){
  stop();

  const tr = $('topRight'); tr.hidden = false; tr.textContent = 'PIN ' + h.pin;
  const screenUrl = location.origin + location.pathname + '?screen';
  let st = null, off = 0, sig = '', armed = null, busy = false;

  async function act(body){
    if (busy) return; busy = true;

    try { await api(null, {...body, pin:h.pin, key:h.key}); } catch (e) { toast(e.message); }
    busy = false; clearTimeout(loop); poll();
  }

  async function poll(){
    try {
      st = await api({pin:h.pin, key:h.key}); off = st.now - Date.now();
      const s = `${st.mode}:${st.phase}:${st.idx}`;
      if (s !== sig) {

        if (st.phase === 'slide' && sig.startsWith('slides:slide:') && $('rStage') && DECK_INFO) { sig = s; slideRemote(); }
        else { sig = s; render(); }
      }
      if (st.phase === 'slide') deckUi('rStage', st.ui);
      live();
    } catch (e) {

  function nowInfo(){
    const n = st.idx + 1, last = n >= st.total;
    switch (st.phase) {
      case 'lobby': return {t:'QR code and PIN', d:'People can join. Choose Quiz or Rating below to start.'};
      case 'question': return {t:`Question ${n} of ${st.total}`, d:esc(st.q.prompt), btn:'Show the answer now', secret:true, timer:true};
      case 'reveal': return {t:`Answer to question ${n}`, d:esc(st.q.prompt), btn:'Show the scoreboard', secret:true};
      case 'board': return {t:`Scoreboard after question ${n}`, d:'', btn:last ? 'Show the podium' : `Next: question ${n + 1}`, top:true};
      case 'quizEnd': return {t:'Quiz podium', d:'The quiz is over. Start the rating or show the QR code.', top:true};
      case 'rate': return {t:`Rating point ${n} of ${st.total}`, d:esc(st.q.prompt), btn:last ? 'Show the results' : 'Next point', avg:true};
      case 'rateEnd': return {t:'Rating results', d:'The class verdict is on screen.'};
      case 'slide': { const part = partAt(st.idx); return {t:`Step ${n} of ${st.total}${part ? ' · ' + esc(part.name) : ''}`, d:'', slide:true}; }
    }

      <section class="panel now">
        <div class="head"><span class="eyebrow">On the big screen now</span><span class="tag hot mono" id="rn">0 players</span></div>
        <h3>${i.t}</h3>
        ${i.d ? `<p class="muted">${i.d}</p>` : ''}
        ${i.secret && st.secret ? `<div class="secret">${ICON.check.replace('<svg', '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4"')}<span><small>Right answer</small><br>${esc(st.secret)}</span></div>` : ''}
        ${i.top ? `<ol class="board" id="rTop"></ol>` : ''}
        ${i.slide ? `${deckFrame('rStage')}

          <div class="jump">${(DECK_INFO ? DECK_INFO.stops : []).map(x => `<button data-k="${x.step}" class="${partAt(st.idx) && partAt(st.idx).step === x.step ? 'on' : ''}">${esc(x.name)}</button>`).join('')}</div>` : ''}

        <div class="panel joinbox"><span class="eyebrow">Scan to join</span><div class="qr" id="qr"></div>
          <p class="url">or open <b>${esc(location.host)}</b> and type the PIN</p>
          <div class="pin" aria-label="Game PIN ${esc(pin)}">${[...pin].map((d, i) => `<span style="animation-delay:${.3 + i * .07}s">${d}</span>`).join('')}</div></div>
        <div class="panel"><div class="head"><h2 class="title">Who's playing</h2><span class="bigcount" id="pcount">0</span></div>
          <div class="chips" id="chips"></div>
          <p class="waiting" id="waitMsg"><span class="dotsx"><i></i><i></i><i></i></span>Waiting for players. The host starts the game from their phone.</p></div></section>`);
      if (window.QRCode) new QRCode($('qr'), {text:joinUrl, width:540, height:540, colorDark:'#000000', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M});
      else $('qr').innerHTML = `<p style="color:#000000;margin:0;max-width:220px;word-break:break-all">${esc(joinUrl)}</p>`;
    }
    else if (st.phase === 'question') {
      Sound.music('think');
      if (preLeft(st, off) > 0) renderPre(); else renderQ();
      tick = setInterval(() => {
        const pre = preLeft(st, off);
        if (pre > 0) {
          const sec = Math.ceil(pre / 1000);
          if (sec !== preSec && sec <= 3 && $('cd')) { preSec = sec; const r = $('cdRing'); r.classList.remove('tick'); void r.offsetWidth; r.classList.add('tick'); $('cd').outerHTML = `<b id="cd">${sec}</b>`; Sound.sfx.count(); }
          return;
        }
        if (!qOpen) { Sound.sfx.go(); renderQ(); }
        const ms = timeLeft(st, off), sec = Math.ceil(ms / 1000);
        paintTimer(ms, st.q.limit);
        if (sec <= 5 && sec < lastSec && sec > 0) Sound.sfx.tick();
        lastSec = sec;
      }, 100);
    }
    else if (st.phase === 'reveal') {
      Sound.stopMusic(); Sound.sfx.reveal();
      const q = st.q, r = st.reveal, most = r.counts ? Math.max(1, ...r.counts) : 1;
      setApp(`<section class="panel">
        <div class="head"><span class="qnum"><b>${n}</b>/ ${st.total}<span class="tag">${esc(q.label)}</span></span><span class="stat"><b>${r.okCount}</b> of ${r.answered} got it right</span></div>
        <div class="qstage">
          <div class="clip"><video src="media/q${q.clip}.mp4" poster="media/q${q.clip}.jpg" autoplay muted loop playsinline></video></div>
          <p class="hprompt">${plainPrompt(q.prompt)}</p>
        </div>
        ${q.type === 'mc'
          ? `<div class="tiles">${tilesHtml(q.options, i => i === r.answer ? 'yes' : 'no', i => `<span class="cnt">${r.counts[i]}</span><i class="fillbar" data-w="${r.counts[i] / most}"></i>`)}</div>`
          : `<div class="row" style="align-items:baseline;gap:16px"><span class="stat">Right answer</span><span class="answerbig">${esc(r.accept)}</span></div><div class="cloud" id="cloud"></div>`}
        <p class="why">${esc(r.why)}</p>
      </section>`);
      nextFrame(() => document.querySelectorAll('.fillbar').forEach(b => b.style.transform = `scaleX(${b.dataset.w})`));
      if (q.type === 'fill') { cloud(st.live.words || []); setTimeout(() => burstAt(document.querySelector('.word.ok') || document.querySelector('.answerbig'), 40), 500); }
      else setTimeout(() => burstAt(document.querySelector('.tile.yes'), 40), 400);
    }
    else if (st.phase === 'board') {
      Sound.music('lobby');
      const top = (st.board || []).slice(0, 5), max = Math.max(1, ...top.map(b => b.score)), last = n >= st.total;
      setApp(`<section class="panel"><div class="head"><h2 class="title">Scoreboard</h2><span class="tag mono">${last ? 'Final question done' : `After question ${n} of ${st.total}`}</span></div>
        <div class="sb" id="sb">${top.length ? top.map((b, i) => `<div class="sbrow" data-prev="${b.prev ?? ''}"><i class="bar2" data-w="${b.score / max}"></i><span class="pos">${i + 1}</span><span class="nm">${esc(b.name)}${b.prev != null && b.prev > i ? ` <span class="arrow-up">▲${b.prev - i}</span>` : ''}</span><span class="gain">${b.gain ? '+' + b.gain : ''}</span><span class="pts" data-to="${b.score}" data-from="${b.score - b.gain}">${b.score - b.gain}</span></div>`).join('') : '<p class="muted">Nobody has scored yet.</p>'}</div>
        <p class="muted">Waiting for the host…</p></section>`);
      flipBoard();
    }
    else if (st.phase === 'quizEnd') {
      Sound.stopMusic();
      const b = st.board || [], order = [1, 0, 2].filter(i => b[i]);
      setApp(`<section class="panel"><div class="head"><h2 class="title">And the winner is…</h2><span class="tag hot mono">${(st.live && st.live.n) || b.length} players</span></div>
        ${b.length ? `<div class="podium">${order.map(i => `<div class="pod p${i + 1}">${i === 0 ? '<div class="spot"></div>' : ''}<div class="av">${esc((b[i].name || '?')[0].toUpperCase())}</div><div class="nm">${esc(b[i].name)}</div><div class="pts">${b[i].score} pts</div><div class="block">${i + 1}</div></div>`).join('')}</div>
        <ol class="board">${b.slice(3, 8).map((r, i) => `<li style="animation-delay:${6 + i * .08}s"><span class="pos">${i + 4}</span><span>${esc(r.name)}</span><span class="pts">${r.score}</span></li>`).join('')}</ol>` : '<p class="muted">Nobody played this time.</p>'}</section>`);
      if (b.length) {
        setTimeout(() => Sound.sfx.pop(), 1100); setTimeout(() => Sound.sfx.pop(), 2200);
        setTimeout(() => Sound.sfx.drumroll(2.2), 2400);
        setTimeout(() => { Sound.sfx.fanfare(); confetti(innerWidth / 2, innerHeight * .45, 260, 1.2); setTimeout(() => confetti(innerWidth * .2, innerHeight * .6, 90), 300); setTimeout(() => confetti(innerWidth * .8, innerHeight * .6, 90), 500); }, 5200);
      }
    }
    else if (st.phase === 'rate') {
      Sound.music('lobby'); lastVotes = st.live.votes;
      setApp(`<section class="panel">
        <div class="head"><span class="qnum"><b>${n}</b>/ ${st.total}<span class="tag">Writing checklist</span></span><span class="stat"><b id="vN">0</b> / <span id="pN">0</span> voted</span></div>
        <div class="ratestage" id="rstage">
          <div class="screen-box"><video src="media/slide${SLIDE_FOR[st.idx]}.mp4" poster="media/slide${SLIDE_FOR[st.idx]}.jpg" autoplay muted loop playsinline></video></div>
          <div style="display:grid;gap:14px"><p class="hprompt">${wordsHtml(st.q.prompt)}</p>
            <div class="overall"><span class="big" id="avgBig">–</span><div class="bigstars" id="avgStars">${stars(0)}</div></div>
            <p class="muted">Give this point 1 to 5 stars on your phone.</p></div>
        </div></section>`);
    }
    else if (st.phase === 'rateEnd') {
      Sound.stopMusic(); setTimeout(() => Sound.sfx.fanfare(), 600);
      const res = st.results || [], voted = res.filter(r => r.n), all = voted.length ? voted.reduce((a, r) => a + r.avg, 0) / voted.length : 0;
      setApp(`<section class="panel"><div class="head"><h2 class="title">Our review, rated by the class</h2><span class="tag mono">Results</span></div>
        <div class="overall"><span class="big" id="allAvg">0.0</span><div><div class="bigstars">${stars(all)}</div><p class="muted">Average out of 5</p></div></div>
        <div class="results">${res.map((r, i) => `<div class="resrow" style="animation-delay:${.3 + i * .12}s"><div>${esc(r.text)}<span>${r.n ? r.avg.toFixed(1) : '–'}</span></div><div class="meter"><i data-w="${r.avg / 5}"></i></div></div>`).join('')}</div></section>`);
      countUp($('allAvg'), all, 1, 1600);
      setTimeout(() => document.querySelectorAll('.meter i').forEach((b, i) => setTimeout(() => b.style.transform = `scaleX(${b.dataset.w})`, i * 120)), 300);
      setTimeout(() => confetti(), 900);
    }
    live();
  }

  function renderPre(){
    preSec = 0;
    const q = st.q, n = st.idx + 1;
    setApp(`<section class="pre">
      <span class="eyebrow">Question ${n} of ${st.total} · ${esc(q.label)}</span>
      <p class="hprompt">${wordsHtml(q.prompt, .09)}</p>
      <div class="cdring" id="cdRing"><b id="cd"></b></div>
      <p class="muted">${q.type === 'mc' ? 'Get ready to tap your answer' : 'Get ready to type the missing words'}</p>
    </section>`);
  }

  function renderQ(){
    qOpen = true; lastSec = 99;
    const q = st.q, n = st.idx + 1;
    setApp(`<section class="panel">
      <div class="head"><span class="qnum"><b>${n}</b>/ ${st.total}<span class="tag">${esc(q.label)}</span></span>
        <div class="row" style="gap:18px"><span class="stat"><b id="ansN">0</b> / <span id="plN">0</span> answered</span>${timerHtml()}</div></div>
      <div class="qstage">
        <div class="clip"><video src="media/q${q.clip}.mp4" poster="media/q${q.clip}.jpg" autoplay muted loop playsinline></video></div>
        <p class="hprompt">${plainPrompt(q.prompt)}</p>
      </div>
      ${q.type === 'mc' ? `<div class="tiles">${tilesHtml(q.options)}</div>`
        : `<div class="cloud" id="cloud"><p class="empty">Your answers appear here as you send them</p></div>`}
    </section>`);
    live();
  }

  // scoreboard rows start where they were last time and slide to their new rank
  function flipBoard(){
    const rows = [...document.querySelectorAll('.sbrow')]; if (!rows.length) return;
    const h = rows[0].offsetHeight + 10;
    rows.forEach((r, i) => { const p = r.dataset.prev === '' ? rows.length : Math.min(+r.dataset.prev, rows.length); r.style.transform = `translateY(${(p - i) * h}px)`; });
    setTimeout(() => {
      rows.forEach(r => { r.classList.add('move'); r.style.transform = ''; });
      Sound.sfx.whoosh();
    }, 700);
    setTimeout(() => {
      rows.forEach((r, i) => {
        r.querySelector('.bar2').style.transform = `scaleX(${r.querySelector('.bar2').dataset.w})`;
        const g = r.querySelector('.gain'); if (g.textContent) g.classList.add('show');
        const pts = r.querySelector('.pts'); countUp(pts, +pts.dataset.to, 0, 900, +pts.dataset.from);
      });
    }, 1500);
  }

  function live(){
    const L = st.live || {n:0, done:0, names:[]};
    if (st.phase === 'lobby' && $('chips')) {
      L.names.forEach(name => {
        if (shown.has(name)) return; shown.add(name);
        const s = document.createElement('span'); s.className = 'pchip'; s.textContent = name; $('chips').appendChild(s);
        Sound.sfx.pop(); setTimeout(() => burstAt(s, 18), 120);
      });
      const c = $('pcount'); if (c.textContent !== String(L.n)) { c.textContent = L.n; c.classList.remove('bump'); void c.offsetWidth; }
      $('waitMsg').hidden = L.n > 0;
    }
    if ($('ansN')) { $('ansN').textContent = L.done; $('plN').textContent = L.n; }
    if (st.phase === 'question' && qOpen && st.q.type === 'fill') cloud(L.words || []);
    if (st.phase === 'rate' && $('avgBig')) {
      $('vN').textContent = L.votes; $('pN').textContent = L.n;
      $('avgBig').textContent = L.votes ? L.avg.toFixed(1) : '–';
      $('avgStars').innerHTML = stars(L.avg);
      if (L.votes > lastVotes) {
        for (let k = 0; k < Math.min(5, L.votes - lastVotes); k++) setTimeout(() => {
          const f = document.createElement('span'); f.className = 'fstar'; f.textContent = '★'; f.style.left = (10 + Math.random() * 80) + '%';
          $('rstage') && $('rstage').appendChild(f); setTimeout(() => f.remove(), 1900); Sound.sfx.pop();
        }, k * 180);
        const b = $('avgBig'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
      }
      lastVotes = L.votes;
    }
  }

  // live word cloud: new words pop in, sizes follow how many typed them, the reveal marks the right one
  function cloud(words){
    const box = $('cloud'); if (!box) return;
    const max = Math.max(1, ...words.map(x => x.c));
    if (words.length) box.querySelector('.empty')?.remove();
    words.forEach(x => {
      let el = [...box.children].find(e => e.dataset.w === x.w);
      if (!el) {
        el = document.createElement('span'); el.className = 'word'; el.dataset.w = x.w;
        el.style.setProperty('--r', (Math.random() * 10 - 5).toFixed(1) + 'deg');
        el.append(document.createTextNode(x.w), document.createElement('sup'));
        box.appendChild(el);
        if (st.phase === 'question') Sound.sfx.pop();
      }
      el.style.fontSize = (32 + 64 * x.c / max) + 'px';
      el.querySelector('sup').textContent = x.c > 1 ? '×' + x.c : '';
      if ('ok' in x) { el.classList.toggle('ok', x.ok); el.classList.toggle('dim', !x.ok); }
    });
  }
}

/* press F on the big screen for full screen */
addEventListener('keydown', e => { if ((e.key === 'f' || e.key === 'F') && document.body.classList.contains('host') && !e.target.closest('input')) { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } });

/* ================= phones ================= */
function joinView(pin, err){
  stop();
  setApp(`<section class="panel"><div class="head"><h2 class="title">Join the game</h2><span class="tag">Player</span></div>
    <form class="form" id="jf" novalidate>
      <label for="pinIn">Game PIN</label><input id="pinIn" class="pinput" inputmode="numeric" maxlength="6" autocomplete="off" value="${esc(pin)}" placeholder="123456">
      <label for="nameIn">Your name</label><input id="nameIn" maxlength="20" autocomplete="nickname" value="${esc(store.get('rl-name') || '')}" placeholder="Your name">
      <p class="err" id="jerr" role="alert">${esc(err || '')}</p>
      <button class="btn" id="jbtn">Join the game</button>
    </form></section>`);
  (pin ? $('nameIn') : $('pinIn')).focus({preventScroll:true});
  $('jf').addEventListener('submit', async e => {
    e.preventDefault();
    const p = $('pinIn').value.replace(/\D/g, ''), name = $('nameIn').value.trim();
    if (p.length !== 6) { $('jerr').textContent = 'The PIN has 6 digits. You can see it on the big screen.'; return; }
    if (!name) { $('jerr').textContent = 'Type your name so the class can see you.'; return; }
    $('jbtn').disabled = true; Sound.sfx.tap();
    try { await api(null, {action:'join', pin:p, id:ME, name}); store.set('rl-name', name); store.set('rl-player', p); Sound.sfx.join(); playerGame(p); }
    catch (er) { $('jerr').textContent = er.status === 404 ? 'No game with this PIN. Check the big screen.' : er.message; $('jbtn').disabled = false; }
  });
}

function playerGame(pin){
  stop();
  history.replaceState(null, '', location.pathname + '?pin=' + pin);
  let st = null, off = 0, sig = '', sentFor = '', heard = '', open = false;
  const tr = $('topRight');

  async function poll(){
    try {
      st = await api({pin, id:ME}); off = st.now - Date.now();
      if (!st.me) { store.del('rl-player'); return joinView(pin, 'Join again to keep playing.'); }
      tr.hidden = false; tr.textContent = `${st.me.name} · ${st.me.score}`;
      const s = [st.mode, st.phase, st.idx, st.me.answer ? 'a' : '', sentFor === st.phase + ':' + st.idx ? 's' : ''].join(':');
      if (s !== sig) { sig = s; render(); }
      if (st.phase === 'slide') deckUi('pStage', st.ui);
    } catch (e) {
      if (e.status === 404) { store.del('rl-player'); return joinView('', 'That game has ended.'); }
    }
    loop = setTimeout(poll, 1000);
  }

  async function send(body){
    Sound.sfx.tap(); if (navigator.vibrate) navigator.vibrate(20);
    sentFor = st.phase + ':' + st.idx; sig = ''; render();
    try { await api(null, {...body, pin, id:ME}); } catch (e) { sentFor = ''; toast(e.message); }
    clearTimeout(loop); poll();
  }
  const once = (key, fn) => { if (heard !== key) { heard = key; fn(); } };

  function render(){
    clearInterval(tick);
    const me = st.me, n = st.idx + 1, key = st.phase + ':' + st.idx;
    if (st.phase === 'lobby') {
      setApp(`<div class="pstate"><div class="badge">${ICON.wave}</div><h2>You're in, ${esc(me.name)}</h2><p>Look at the big screen. The host starts the next round.</p><p class="waiting"><span class="dotsx"><i></i><i></i><i></i></span></p></div>`);
    }
    else if (st.phase === 'question') {
      const q = st.q;
      if (me.answer || sentFor === key) {
        setApp(`<div class="pstate"><div class="badge">${ICON.clock}</div><h2>Answer sent</h2><p>Waiting for the rest of the class…</p><p class="waiting"><span class="dotsx"><i></i><i></i><i></i></span></p></div>`);
      } else if (preLeft(st, off) > 0) {
        open = false;
        setApp(`<div class="pstate"><span class="eyebrow">Question ${n} of ${st.total}</span><div class="cdring" id="cdRing"><b id="cd"></b></div><p>Look at the big screen</p></div>`);
        let last = 0;
        tick = setInterval(() => {
          const pre = preLeft(st, off);
          if (pre <= 0) { clearInterval(tick); sig = ''; render(); return; }
          const sec = Math.ceil(pre / 1000);
          if (sec !== last && sec <= 3) { last = sec; const r = $('cdRing'); r.classList.remove('tick'); void r.offsetWidth; r.classList.add('tick'); $('cd').outerHTML = `<b id="cd">${sec}</b>`; if (navigator.vibrate) navigator.vibrate(10); }
        }, 100);
      } else if (timeLeft(st, off) <= 0) {
        setApp(`<div class="pstate badx"><div class="badge">${ICON.clock}</div><h2>Time's up</h2><p>Get ready for the next question.</p></div>`);
      } else {
        open = true;
        setApp(`<div class="ptop"><span class="qnum"><b>${n}</b>/ ${st.total}</span>${timerHtml()}</div>
          ${q.type === 'mc'
            ? `<p class="muted" style="margin:4px 0 8px">${esc(q.prompt).replace('___', '____')}</p><div class="ptiles">${tilesHtml(q.options, () => '', () => '', 'button')}</div>`
            : `<form class="form" id="ff" style="margin-top:14px" novalidate><p class="hprompt" style="font-size:24px">${plainPrompt(q.prompt)}</p>
                 <label for="fillIn">Missing words</label><input id="fillIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type here"><button class="btn">Send the answer</button></form>`}`);
        if (q.type === 'mc') document.querySelectorAll('.ptiles .tile').forEach(b => b.addEventListener('click', () => send({action:'answer', choice:+b.dataset.i})));
        else { $('ff').addEventListener('submit', e => { e.preventDefault(); const v = $('fillIn').value.trim(); if (v) send({action:'answer', text:v}); }); $('fillIn').focus({preventScroll:true}); }
        tick = setInterval(() => { const ms = timeLeft(st, off); paintTimer(ms, q.limit); if (ms <= 0) { clearInterval(tick); sig = ''; render(); } }, 200);
      }
    }
    else if (st.phase === 'reveal' || st.phase === 'board') {
      const a = me.answer, rank = me.rank ? `You're ${ord(me.rank)} with ${me.score} points` : `${me.score} points`;
      if (st.phase === 'board') setApp(`<div class="pstate"><div class="badge">${ICON.chart}</div><h2>${me.rank ? ord(me.rank) + ' place' : 'Scoreboard'}</h2><p>${rank}</p></div>`);
      else if (a && a.ok) {
        setApp(`<div class="pstate good"><div class="badge">${ICON.check}</div><h2>Correct</h2><p class="pts-big">+<span id="ptsUp">0</span></p>${me.streak >= 2 ? `<span class="streak">${me.streak} in a row</span>` : ''}<p>${rank}</p></div>`);
        countUp($('ptsUp'), a.pts, 0, 800);
        once(key, () => { Sound.sfx.correct(); confetti(innerWidth / 2, innerHeight * .35, 70, .7); if (navigator.vibrate) navigator.vibrate(60); });
      } else {
        setApp(`<div class="pstate badx"><div class="badge">${a ? ICON.cross : ICON.clock}</div><h2>${a ? 'Not quite' : 'Too slow'}</h2><p>${esc(st.reveal.why)}</p><p>${rank}</p></div>`);
        once(key, () => { Sound.sfx.wrong(); if (navigator.vibrate) navigator.vibrate([80, 60, 80]); });
      }
    }
    else if (st.phase === 'quizEnd') {
      setApp(`<div class="pstate good"><div class="badge">${ICON.trophy}</div><h2>${me.rank ? 'You finished ' + ord(me.rank) : 'Quiz over'}</h2><p>${me.score} points. Look at the big screen for the podium.</p></div>`);
      once(key, () => { if (me.rank && me.rank <= 3) setTimeout(() => { confetti(); Sound.sfx.fanfare(); }, 5200); });
    }
    else if (st.phase === 'rate') {
      const r = me.rating || 0;
      setApp(`<div class="ptop"><span class="qnum"><b>${n}</b>/ ${st.total}</span><span class="tag">Writing checklist</span></div>
        <div class="pstate" style="min-height:50vh"><h2 style="font-size:26px">${esc(st.q.prompt)}</h2>
          <div class="pstars" role="radiogroup" aria-label="Stars">${[1, 2, 3, 4, 5].map(k => `<button role="radio" aria-checked="${k === r}" data-k="${k}" class="${k <= r ? 'on' : ''}" aria-label="${k} star${k > 1 ? 's' : ''}">${STAR}</button>`).join('')}</div>
          <p id="rmsg">${r ? 'Saved. You can still change it.' : 'Tap the stars to rate this point.'}</p></div>`);
      document.querySelectorAll('.pstars button').forEach(b => b.addEventListener('click', () => {
        const k = +b.dataset.k; me.rating = k;
        document.querySelectorAll('.pstars button').forEach(x => { x.classList.toggle('on', +x.dataset.k <= k); x.setAttribute('aria-checked', +x.dataset.k === k); });
        Sound.sfx.pop(); if (navigator.vibrate) navigator.vibrate(15);
        api(null, {action:'rate', pin, id:ME, stars:k}).then(() => { $('rmsg').textContent = 'Saved. You can still change it.'; }).catch(e => toast(e.message));
      }));
    }
    else if (st.phase === 'rateEnd') {
      setApp(`<div class="pstate good"><div class="badge">${ICON.star}</div><h2>Thanks for rating</h2><p>The class verdict is on the big screen.</p></div>`);
    }
    else if (st.phase === 'slide') {
      if (!$('pStage')) { setApp(`<div class="ptop"><span class="eyebrow">Live presentation</span><span class="qnum" id="pNum"></span></div><div style="margin-top:12px">${deckFrame('pStage')}</div><p class="muted" style="margin-top:12px;font-size:14px">The presentation follows the presenter. Turn your phone sideways for a bigger view.</p>`); mountDeck('pStage'); }
      $('pNum').textContent = `${st.idx + 1} / ${st.total}`;
      deckGo('pStage', st.idx);
    }
  }

  poll();
}

/* ================= start ================= */
const qs = new URLSearchParams(location.search);
const urlPin = qs.get('pin'), screenPin = qs.get('screen'), savedHost = JSON.parse(store.get('rl-host') || 'null');
if (screenPin && /^\d{6}$/.test(screenPin)) screenView(screenPin);
else if (qs.has('screen')) screenAuto();
else if (qs.has('remote') && savedHost) remoteView(savedHost);
else if (urlPin && store.get('rl-player') === urlPin) playerGame(urlPin);
else if (urlPin) joinView(urlPin);
else home();
</script>
